<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F1E8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121019" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Budget it">
<meta name="application-name" content="Budget it">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Budget it</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg?v=2" type="image/svg+xml">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,800&family=Dela+Gothic+One&display=swap">
<style>

/* Layout: Split it's comic layout. One 560px column, dark hero with the guide, slanted section tags, floating tab bar with a big + button, sheets slide up. */
:root{--bg:#F5F1E8;--surface:#FFFFFF;--surface2:#F1ECE1;--ink:#14112A;--edge:#14112A;--pop:#14112A;--muted:#5D5870;--line:rgba(20,17,42,.14);
  --hero:#1A1626;--hero-ink:#F7F3EA;--hero-muted:#C9C3DA;--hl:#FFD23F;--hl-ink:#14112A;--paper:#F3E3C3;--paper-ink:#3A2414;--stamp:#B3261E;
  --good:#0A7542;--bad:#E0243C;--warn:#B86E00;--dot:rgba(20,17,42,.07);
  --c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;--c4:#eda100;--c5:#e87ba4;--c6:#6250d6;--c7:#e34948;--c8:#7a7590;
  --display:"Dela Gothic One","Bricolage Grotesque",system-ui,sans-serif;--body:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,monospace;--tabh:64px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121019;--surface:#1D1A2A;--surface2:#262236;--ink:#F1EEFF;--edge:#9C94C8;--pop:#5B5391;--muted:#ADA7C6;--line:rgba(241,238,255,.12);
  --hero:#241D3F;--hero-ink:#F7F3EA;--hero-muted:#C9C3DA;--hl:#FFD23F;--hl-ink:#14112A;--paper:#E9D6B0;--paper-ink:#3A2414;--stamp:#B3261E;
  --good:#4FD39A;--bad:#FF6B7D;--warn:#F2B544;--dot:rgba(241,238,255,.10);
  --c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c6:#9085e9;--c7:#e66767;--c8:#8b86a3;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121019;--surface:#1D1A2A;--surface2:#262236;--ink:#F1EEFF;--edge:#9C94C8;--pop:#5B5391;--muted:#ADA7C6;--line:rgba(241,238,255,.12);
  --hero:#241D3F;--hero-ink:#F7F3EA;--hero-muted:#C9C3DA;--hl:#FFD23F;--hl-ink:#14112A;--paper:#E9D6B0;--paper-ink:#3A2414;--stamp:#B3261E;
  --good:#4FD39A;--bad:#FF6B7D;--warn:#F2B544;--dot:rgba(241,238,255,.10);
  --c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c6:#9085e9;--c7:#e66767;--c8:#8b86a3;color-scheme:dark}
*{box-sizing:border-box}
body{background-color:var(--bg);background-image:radial-gradient(var(--dot) 1.1px,transparent 1.3px);background-size:12px 12px;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(var(--tabh) + 44px + env(safe-area-inset-bottom,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--c1);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-top:12px}
.num{font-variant-numeric:tabular-nums}
.ico{width:1.25em;height:1.25em;display:inline-block;vertical-align:-.28em;flex:none}
.muted{color:var(--muted)}
.small{font-size:.86rem}
/* top bar */
.top{display:flex;align-items:center;gap:12px;padding:6px 0 14px}
.top h1{flex:1;margin:0;font-family:var(--display);font-weight:400;font-size:1.45rem;line-height:1.15;min-width:0}
.icon-btn{background:var(--surface);border:2.5px solid var(--edge);box-shadow:2px 2px 0 var(--pop);border-radius:999px;width:42px;height:42px;display:grid;place-items:center;flex:none}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.8rem;border:2px solid var(--edge);background:var(--c7);color:#fff}
.mpick{display:flex;align-items:center;gap:4px;border:2px solid var(--edge);border-radius:999px;background:var(--surface);padding:2px}
.mpick button{border:0;background:none;width:32px;height:30px;border-radius:999px;display:grid;place-items:center;color:var(--ink)}
.mpick button:disabled{opacity:.3}
.mpick button svg{width:18px;height:18px}
.mpick span{font-weight:800;font-size:.86rem;min-width:74px;text-align:center}
/* hero */
.hero{position:relative;margin-top:40px;min-height:184px;display:flex;align-items:flex-end;padding:22px 20px;border:3px solid var(--edge);border-radius:18px;box-shadow:5px 5px 0 var(--hl);
  background:repeating-conic-gradient(from 0deg at 100% 100%,rgba(255,255,255,.05) 0deg 2deg,transparent 2deg 7deg) var(--hero);color:var(--hero-ink)}
.hero.plain{margin-top:0;min-height:0}
.htext{position:relative;z-index:2;width:calc(100% - 118px)}
.hero.plain .htext{width:100%}
.hero.plain .big{font-size:min(3.4rem,calc((min(100vw,560px) - 84px)/(var(--n,6)*.86)))}
.hero:not(.plain){padding-top:62px}
.hero .lbl{margin:0;color:var(--hero-muted);font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.hero .big{font-family:var(--display);font-size:min(3.4rem,calc((min(100vw,560px) - 196px)/(var(--n,6)*.74)));line-height:1;margin:6px 0 2px;white-space:nowrap;font-variant-numeric:tabular-nums}
.cents{font-size:.45em;vertical-align:.62em;margin-left:2px}
.hero .hline{margin:6px 0 0;color:var(--hero-muted);font-size:.92rem}
.hero .pace{height:10px;border-radius:999px;background:rgba(255,255,255,.14);position:relative;margin-top:12px;overflow:hidden}
.hero .pace i{position:absolute;inset:0 auto 0 0;background:var(--hl);border-radius:999px}
.hero .pace b{position:absolute;top:0;bottom:0;width:3px;background:#fff}
.hart{position:absolute;right:4px;bottom:0;width:132px;height:calc(100% + 54px);overflow:hidden;border-radius:0 0 18px 0;z-index:1;background:none;border:0;padding:0;display:block}
.hart img{position:absolute;left:0;bottom:0;width:100%;height:100%;object-fit:contain;object-position:50% 100%;filter:drop-shadow(0 5px 0 rgba(0,0,0,.28));animation:bob 2.6s ease-in-out infinite;transform-origin:50% 90%}
.hart.m-worried img{animation:fret 3.2s ease-in-out infinite}
.hart.m-celebrate img{animation:hop .8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes fret{25%{transform:rotate(-1.5deg)}75%{transform:rotate(1.5deg)}}
@keyframes hop{50%{transform:translateY(-10px) rotate(-3deg)}}
.speech{position:absolute;right:12px;top:-28px;max-width:min(60%,240px);background:#fff;color:#14112A;border:2.5px solid #14112A;border-radius:14px;padding:8px 11px;font-size:.84rem;font-weight:600;line-height:1.3;box-shadow:3px 3px 0 #14112A;z-index:3;animation:pop .3s cubic-bezier(.2,1.5,.4,1) both;margin:0}
@keyframes pop{from{transform:scale(.8);opacity:0}}
/* quick add */
.quick{margin-top:14px;background:var(--surface);border:2.5px solid var(--edge);border-radius:14px;box-shadow:4px 4px 0 var(--pop);padding:5px 5px 5px 14px;display:flex;align-items:center;gap:6px}
.quick input{flex:1;border:0;background:none;padding:10px 0;font-size:1rem;min-width:0;outline:none}
.quick:has(input:focus-visible),.search:has(input:focus-visible),.amtin:has(input:focus-visible){outline:3px solid var(--c1);outline-offset:2px}
.qbtn{border:2px solid var(--edge);border-radius:13px;height:40px;width:40px;flex:none;display:grid;place-items:center;background:color-mix(in srgb,var(--hl) 30%,var(--surface));color:var(--ink)}
.qbtn svg{width:22px;height:22px}
.qbtn.go{background:var(--hl);color:var(--hl-ink)}
.qhint{font-size:.84rem;color:var(--muted);margin:7px 4px 0}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.tile{background:var(--surface);border:2px solid var(--edge);border-radius:14px;box-shadow:3px 3px 0 var(--pop);padding:10px 12px;text-align:left;display:grid;gap:2px;min-width:0}
.tile small{color:var(--muted);font-size:.76rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile b{font-family:var(--display);font-weight:400;font-size:clamp(.84rem,3.7vw,1.15rem);white-space:nowrap;font-variant-numeric:tabular-nums}
.tile b .cents{font-size:.66em;vertical-align:baseline;margin:0}
/* sections */
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:30px 2px 10px}
.sec-h h2{margin:0;display:inline-block;background:var(--ink);color:var(--bg);padding:5px 14px 4px;font-family:var(--display);font-weight:400;font-size:.98rem;transform:skewX(-10deg);box-shadow:3px 3px 0 var(--hl)}
.links{display:flex;gap:12px}
.link{background:none;border:0;color:var(--ink);font-weight:800;text-decoration:underline;text-decoration-thickness:2.5px;text-decoration-color:var(--hl);text-underline-offset:4px;padding:6px 2px;white-space:nowrap}
.card{background:var(--surface);border:2.5px solid var(--edge);border-radius:14px;box-shadow:4px 4px 0 var(--pop);overflow:hidden}
.card+.card{margin-top:12px}
.pad{padding:14px 16px}
.empty{border:2.5px dashed var(--edge);border-radius:14px;padding:18px;display:flex;gap:14px;align-items:center;background:var(--surface)}
.empty img{width:64px;height:84px;object-fit:contain;object-position:50% 100%;border-radius:12px;border:2px solid var(--edge);background:var(--hero);flex:none}
.empty strong{display:block}
/* no visible scroll bars (it still scrolls), like Split it */
html,body,.sheet,.chips,.selbar{scrollbar-width:none;-ms-overflow-style:none}
html::-webkit-scrollbar,body::-webkit-scrollbar,.sheet::-webkit-scrollbar,.chips::-webkit-scrollbar,.selbar::-webkit-scrollbar{display:none;width:0;height:0}
.btn.danger{color:var(--bad);border-color:var(--bad);box-shadow:3px 3px 0 var(--bad)}
/* rows */
.row{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-top:1.5px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;color:inherit}
.card>.row:first-child,.card>.day:first-child+.row{border-top:0}
button.row:active{background:var(--surface2)}
.tic{width:42px;height:42px;border-radius:12px;border:2px solid var(--edge);display:grid;place-items:center;flex:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.payoff{margin-top:14px}
.payoff .f{margin-top:8px}
.tic.rank{background:var(--surface2);font-family:var(--display);font-size:1rem;color:var(--ink)}
.ybar{display:block;height:8px;border-radius:99px;background:var(--surface2);border:1.5px solid var(--edge);margin-top:6px;overflow:hidden}
.ybar i{display:block;height:100%}
.tile b+small{display:block;margin-top:2px}
.tic svg{width:22px;height:22px}
.rt{min-width:0}
.rt b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt small{display:block;font-size:.84rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:800;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.amt.in{color:var(--good)}
.amt small{display:block;font-weight:600;color:var(--muted);font-size:.75rem}
.pill{display:inline-flex;align-items:center;gap:4px;border:2px solid var(--edge);border-radius:999px;padding:3px 10px;font-weight:800;font-size:.78rem;background:var(--surface);white-space:nowrap}
.pill.good{border-color:var(--good);color:var(--good)}.pill.warn{border-color:var(--warn);color:var(--warn)}.pill.bad{border-color:var(--bad);color:var(--bad)}
.pill.hl{background:var(--hl);color:var(--hl-ink);border-color:var(--edge)}
.newdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c7);margin-left:6px;vertical-align:2px}
.day{padding:8px 14px 5px;font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:800;background:var(--surface2);border-top:1.5px solid var(--line);display:flex;justify-content:space-between}
.card>.day:first-child{border-top:0}
/* buttons */
.btn{border:2.5px solid var(--edge);box-shadow:3px 3px 0 var(--pop);font-weight:800;border-radius:12px;background:var(--surface);color:var(--ink);padding:10px 16px;white-space:nowrap;line-height:1.2;transition:transform .06s,box-shadow .06s}
.btn:active{transform:translate(3px,3px);box-shadow:none}
.btn.primary{background:var(--hl);color:var(--hl-ink)}
.btn.sm{padding:6px 12px;font-size:.86rem;border-width:2px;box-shadow:2px 2px 0 var(--pop)}
.btn.block{display:block;width:100%;padding:13px}
a.btn{text-decoration:none;text-align:center}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.sheet .btns{margin-top:0}
.btns .btn{flex:1}
/* needs you */
.needs{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1.5px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.card>.needs:first-child{border-top:0}
.needs .n{min-width:30px;height:30px;border-radius:9px;background:var(--hl);color:var(--hl-ink);border:2px solid var(--edge);display:grid;place-items:center;font-weight:800}
.needs>span:nth-child(2){flex:1;min-width:0}
.needs small{display:block;color:var(--muted);font-size:.84rem}
.needs .chev{transform:rotate(180deg);color:var(--muted)}
/* bars */
.bar{height:12px;border-radius:999px;background:var(--surface2);border:2px solid var(--edge);position:relative;overflow:hidden;display:block}
.bar i{position:absolute;top:0;bottom:0;left:0;border-radius:999px}
.bar b{position:absolute;top:-1px;bottom:-1px;width:2.5px;background:var(--ink)}
.bud{display:grid;grid-template-columns:42px minmax(0,1fr);gap:6px 12px;align-items:center;padding:13px 14px;border-top:1.5px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.card>.bud:first-child{border-top:0}
.bud .tic{grid-row:span 3}
.bud .h{display:flex;justify-content:space-between;align-items:center;gap:8px;min-width:0}
.bud .h b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bud .s{display:flex;justify-content:space-between;gap:10px;font-size:.84rem;color:var(--muted);font-variant-numeric:tabular-nums}
/* wanted poster */
.poster{margin-top:30px;display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;background:var(--paper);color:var(--paper-ink);border:3px solid var(--edge);border-radius:6px;box-shadow:5px 5px 0 var(--pop);padding:12px;position:relative;width:100%;text-align:left}
.poster .ph{border:3px solid var(--paper-ink);background:color-mix(in srgb,var(--paper-ink) 8%,var(--paper));display:grid;place-items:center;aspect-ratio:3/4;max-width:100%}
.poster .ph svg{width:52px;height:52px;color:var(--paper-ink)}
.poster .t{display:block;font-family:var(--display);font-weight:400;font-size:1.7rem;letter-spacing:.06em;line-height:1}
.poster .who{display:block;font-weight:800;font-size:1.05rem;margin-top:4px}
.poster .bounty{display:block;font-family:var(--display);color:var(--stamp);font-size:1.45rem;line-height:1.1;margin-top:4px}
.poster .p{display:block;margin-top:4px;font-size:.84rem}
.stamp{position:absolute;right:10px;top:10px;border:2.5px solid var(--stamp);color:var(--stamp);font-family:var(--display);font-size:.72rem;padding:2px 7px;transform:rotate(8deg);border-radius:4px;letter-spacing:.08em}
/* chart */
.chartbox{padding:14px 14px 8px}
.chartbox svg{display:block;width:100%;height:auto;overflow:visible}
.legend{display:flex;gap:14px;font-size:.78rem;color:var(--muted);padding:0 14px 12px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:16px;height:0;border-top:3px solid;display:inline-block}
/* search + chips */
.search{display:flex;align-items:center;gap:8px;min-width:0;background:var(--surface);border:2.5px solid var(--edge);border-radius:14px;box-shadow:3px 3px 0 var(--pop);padding:0 12px;margin-top:16px}
.search input{flex:1;border:0;background:none;padding:12px 0;outline:none;min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 8px;scrollbar-width:none}
.chip{border:2px solid var(--edge);border-radius:999px;padding:6px 12px;background:var(--surface);font-weight:700;font-size:.86rem;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:12px 14px 14px}
.cal .dn{font-size:.7rem;font-weight:800;color:var(--muted);text-align:center;text-transform:uppercase}
.cal .d{aspect-ratio:1;border-radius:9px;display:grid;place-items:center;font-size:.82rem;font-weight:700;position:relative;color:var(--muted)}
.cal .d.today{background:var(--ink);color:var(--bg)}
.cal .d.has{color:var(--hl-ink);background:color-mix(in srgb,var(--hl) 55%,var(--surface));border:2px solid var(--edge)}
.cal .d.has.today{background:var(--ink);color:var(--bg)}
.cal .d.paid{opacity:.5}
.cal .d i{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--c7)}
/* goals */
.goal .rt small{white-space:normal}
.goal{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px;border-top:1.5px solid var(--line)}
.card>.goal:first-child{border-top:0}
.ring{width:64px;height:64px;border-radius:50%;border:2.5px solid var(--edge);display:grid;place-items:center;position:relative}
.ring::after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--surface);border:2px solid var(--edge)}
.ring span{position:relative;z-index:1;font-weight:800;font-size:.8rem}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;pointer-events:none;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
nav.tabs .in{pointer-events:auto;max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));height:var(--tabh);align-items:center;background:var(--surface);border:2.5px solid var(--edge);border-radius:18px;box-shadow:4px 4px 0 var(--pop);padding:0 6px}
nav.tabs .tab{background:none;border:0;height:100%;display:grid;justify-items:center;align-content:center;gap:3px;font-size:.72rem;font-weight:700;color:var(--muted);position:relative}
nav.tabs .tab svg{width:26px;height:26px;padding:3px;border-radius:999px}
nav.tabs .tab[aria-current="page"]{color:var(--ink)}
nav.tabs .tab[aria-current="page"] svg{background:var(--hl);color:var(--hl-ink)}
nav.tabs .badge{position:absolute;top:7px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:999px;background:var(--c7);color:#fff;font-size:.66rem;font-weight:800;display:grid;place-items:center;border:2px solid var(--surface);padding:0 3px}
nav.tabs .add{justify-self:center;width:54px;height:54px;border-radius:16px;background:var(--hl);color:var(--hl-ink);border:3px solid var(--edge);box-shadow:3px 3px 0 var(--pop);display:grid;place-items:center;transition:transform .2s cubic-bezier(.2,1.6,.4,1)}
nav.tabs .add:active{transform:scale(.92)}
nav.tabs .add svg{width:28px;height:28px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,8,20,.5);z-index:30}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-height:90vh;overflow:auto;background:var(--bg);border-top:3px solid var(--edge);border-radius:22px 22px 0 0;
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .24s cubic-bezier(.2,.9,.3,1)}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto}
.sheet .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

/* ---------- Activity ---------- */
function chart() {

  ${[1, 10, 20, n].map(d => `<text x="${x(d)}" y="${H - 5}" text-anchor="middle" font-size="9.5" fill="var(--muted)">${d}</text>`).join('')}
  ${lim ? `<line x1="${P.l}" x2="${W - P.r}" y1="${y(lim)}" y2="${y(lim)}" stroke="var(--bad)" stroke-width="1.5" stroke-dasharray="4 3"/><text x="${W - P.r}" y="${y(lim) - 5}" text-anchor="end" font-size="9.5" fill="var(--bad)" font-weight="700">Budget ${money(lim, { round: true })}</text>` : ''}

  ${now.length ? `<path d="${path(now)}L${x(now.length)},${y(0)}L${x(1)},${y(0)}Z" fill="var(--hl)" opacity=".4"/><path d="${path(now)}" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="${x(now.length)}" cy="${y(now[now.length - 1])}" r="4.5" fill="var(--hl)" stroke="var(--ink)" stroke-width="2.5"/>` : ''}</svg>`;
}
function activity() {

/* ---------- Trends ---------- */

    return `<g${part ? ' opacity=".5"' : ''}><rect x="${x(i) - bw / 2}" y="${y(h)}" width="${bw}" height="${Math.max(0, y(0) - y(h))}" fill="var(--c6)" stroke="var(--edge)" stroke-width="1.5"/>
    <rect x="${x(i) - bw / 2}" y="${y(h + e)}" width="${bw}" height="${Math.max(0, y(h) - y(h + e))}" fill="var(--c1)" stroke="var(--edge)" stroke-width="1.5"/>
    <text x="${x(i)}" y="${H - 6}" text-anchor="middle" font-size="9.5" fill="var(--muted)">${monName(m).slice(0, n > 7 ? 1 : 3)}</text></g>`; }).join('');
  const chart = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Spending each month for the last ${n} months">
    ${[0, max / 2, max].map(v => `<line x1="${P.l}" x2="${W - P.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${P.l - 6}" y="${y(v) + 3.5}" text-anchor="end" font-size="9.5" fill="var(--muted)">$${v >= 1000 ? v / 1000 + 'k' : v}</text>`).join('')}
    ${bars}<line x1="${P.l}" x2="${W - P.r}" y1="${y(avgAll)}" y2="${y(avgAll)}" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="4 3"/><text x="${P.l + 2}" y="${y(avgAll) - 5}" font-size="9.5" font-weight="700" fill="var(--ink)">Usual ${money(avgAll, { round: true })}</text></svg>`;

// Net worth at the end of each month (and today), as a line.

async function call(url, body, method) {
  const r = await fetch(url, { method: method || (body ? 'POST' : 'GET'), credentials: 'same-origin', headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined })
    .catch(() => { throw new Error('Couldn’t reach the laptop. Check your connection and try again.'); });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error === 'signed out' ? 'You’re signed out. Sign in again.' : d.error || 'That didn’t work. Try again.');
  return d;
}
// A second tap confirms, so nothing big happens by accident.
function confirmTap(btn, msg) {
  if (btn.dataset.armed) return true;
  const was = btn.innerHTML; btn.dataset.armed = '1'; btn.textContent = msg;
  setTimeout(() => { if (document.contains(btn) && btn.dataset.armed) { delete btn.dataset.armed; btn.innerHTML = was; } }, 4000);
  return false;
}

// A small form inside a sheet: its own error line, and the button waits while it works.
function miniForm(box, html, label, go) {
  box.innerHTML = `<div class="card mini">${html}<p class="err" id="mfErr" role="alert" hidden></p><div class="btns"><button class="btn primary" type="button" id="mfGo">${label}</button><button class="btn" type="button" id="mfNo">Cancel</button></div></div>`;
  const first = box.querySelector('input'); if (first) first.focus();
  box.querySelector('#mfNo').onclick = () => { box.innerHTML = ''; };
  box.querySelector('#mfGo').onclick = async e => { const b = e.currentTarget, err = box.querySelector('#mfErr'); busy(b, true); err.hidden = true;
    try { await go(); } catch (x) { err.textContent = x.message; err.hidden = false; busy(b, false); } };
  box.querySelectorAll('input').forEach(i => i.onkeydown = e => { if (e.key === 'Enter') box.querySelector('#mfGo').click(); });
}

  <h4>Known issues</h4><ul><li>New charges arrive every few hours, not instantly.</li><li>Plaid's free plan allows 10 bank connections for the whole laptop, and a disconnected bank still counts.</li><li>Coming back from a bank that approves the connection in its own app hasn't been tried with a real bank yet.</li></ul></div>

let selecting = false, picked = new Set();
document.addEventListener('click', e => {
  const so = e.target.closest('[data-signout]'); if (so) { e.preventDefault(); return signOut(); }
  const el = e.target.closest('[data-year],[data-yc],[data-trend],[data-tab],[data-go],[data-sub],[data-back],[data-txn],[data-bud],[data-goal],[data-acct],[data-act],[data-f],[data-month],[data-search],[data-bill],[data-fix],[data-unlink],[data-alert],[data-close]');

  if (el.matches('[data-close]')) return close();
  const d = el.dataset, L = document.getElementById('layer');

  if (d.tab || d.go) { if (d.go === 'activity') { filter = 'all'; q = ''; } return nav(d.tab || d.go); }
  if (d.sub) { if (L.innerHTML) close(); sub = d.sub; selecting = false; pushPage(); render(); scrollTo(0, 0); return; }
  if ('back' in d) { if (LAPTOP && history.state && history.state.bi === 'page') return history.back(); sub = null; render(); return; }
  if (d.search) { q = d.search; filter = 'all'; month = CUR; return nav('activity'); }
  if (d.f) { filter = d.f; shown = 200; render(); return; }
  if (d.month) { month = d.month; shown = 200; render(); return; }
  if (d.year) { yr = d.year; render(); return; }
  if (d.yc) { filter = d.yc; q = ''; month = CUR; return nav('activity'); }
  if (d.trend) return trendSheet(d.trend);
  if (d.alert) return alertSheet(d.alert);
  if (d.txn && selecting) { picked.has(d.txn) ? picked.delete(d.txn) : picked.add(d.txn); render(); return; }
  if (d.txn) return editTxn(d.txn); if (d.bud) return editBudget(d.bud); if (d.goal) return addGoal(d.goal); if (d.acct) return editAcct(d.acct); if (d.bill) return billSheet(d.bill);
  if (d.fix) { if (!LAPTOP) return; return openLink(d.fix); }
  if (d.unlink) { const it = VIEW.items.find(i => i.id === d.unlink); return sheet(`<h3>Disconnect ${esc(it.inst)}?</h3><p style="margin:-6px 0 0">The connection is deleted here and at Plaid, so nothing new comes in. Its accounts and transactions stay, marked disconnected, with your categories, notes and splits. You can delete that history from each account afterwards.</p>${VIEW.plaid.limit ? `<p class="note"><b>Reconnecting this bank later will use another one</b> of your ${VIEW.plaid.limit} free bank connections (${Math.max(0, VIEW.plaid.limit - VIEW.plaid.used)} left). If it only stopped updating, close this and use Reconnect instead.</p>` : ''}<div class="btns"><button class="btn primary" type="button" id="ok">Disconnect</button><button class="btn" type="button" data-close>Cancel</button></div>`, root => root.querySelector('#ok').onclick = () => { close(); post('/api/plaid/remove', { item: it.id }); }); }
  const bulk = args => { const ids = [...picked]; picked = new Set(); selecting = false; api('txn.bulk', { ids, ...args }); };
  ({ add: () => addSheet(), poke: () => { poke++; celebrate = null; render(); }, review, plaid, csv, rules, cats, whatsnew, settings, income, newgoal: newGoal, invite, push: pushOn,
    safe: safeSheet, addbill: () => billForm(null), export: exportCsv, money: moneySheet, signin: signInSheet, friends: friendsSheet, assistants: assistantsSheet, owner: ownerSheet, mydata: myDataSheet, ownernote: ownerNoteSheet,
    private: () => { PRIVATE = !PRIVATE; store.set('bi-private', PRIVATE); close(); render(); toast(PRIVATE ? 'Amounts are hidden. Tap the eye to show them.' : 'Amounts are showing', false); },
    splitit: () => { close(); if (LAPTOP) return splitConnect(); if (CLOUD) return toast('Sending to Split it works in the laptop app, where both apps run.', false); toast('On the laptop, connect Split it here, then use "Split it with someone" on any charge.', false); },
    select: () => { selecting = true; picked = new Set(); render(); }, selectoff: () => { selecting = false; picked = new Set(); render(); },
    bulkcat: () => sheet(`<h3>Move ${picked.size} charge${picked.size === 1 ? '' : 's'} to</h3>${catButtons('')}<div class="btns"><button class="btn" type="button" data-close>Cancel</button></div>`, root => root.querySelectorAll('[data-cat]').forEach(b => b.onclick = () => { close(); bulk({ c: b.dataset.cat }); })),
    bulktag: () => sheet(`<h3>Tag ${picked.size} charge${picked.size === 1 ? '' : 's'}</h3><label class="f">Tag<input class="inp" id="tg" placeholder="#japan-trip"></label><div class="btns"><button class="btn primary" type="button" id="ok">Add tag</button><button class="btn" type="button" data-close>Cancel</button></div>`, root => root.querySelector('#ok').onclick = () => { const v = root.querySelector('#tg').value.trim(); if (!v) return; close(); bulk({ tag: v }); }),
    bulkhide: () => bulk({ hidden: true }),
    more: () => { shown += 200; render(); }, suggest: () => api('budget.suggest'), sample: () => api('sample.load'), unsample: () => { close(); api('sample.clear'); },
    sync: async () => { toast('Asking your banks…', false); await post('/api/plaid/sync'); },
    addacct: () => addAcct(),
    wipe: () => sheet(`<h3>Start over?</h3><p>This deletes every account, transaction, budget, goal and receipt in your Budget it here. It can’t be undone.</p><div class="btns"><button class="btn danger" type="button" id="ok">Delete everything</button><button class="btn" type="button" data-close>Keep it</button></div>`,
      root => root.querySelector('#ok').onclick = () => { close(); VIEW.state = S = blankState(); demoUndo = []; tab = 'home'; sub = null; cloudSave(); render(); toast('Started over', false); }),
    reset: () => { close(); try { localStorage.removeItem('bi-demo-v1'); } catch {} demoUndo = []; demoBoot(); tab = 'home'; sub = null; render(); toast('Started over', false); } })[d.act]?.();
});
document.addEventListener('keydown', e => {
  const L = document.getElementById('layer'); if (!L.innerHTML) return;
  if (e.key === 'Escape') return close();
  // Tab stays inside an open sheet, so keyboard and screen reader users don't wander behind it
  if (e.key === 'Tab') {
    const f = [...L.querySelectorAll('.sheet button:not([disabled]),.sheet input,.sheet select,.sheet textarea,.sheet summary,.sheet a[href],.sheet label.btn')].filter(x => x.offsetParent !== null);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && (document.activeElement === first || !L.contains(document.activeElement))) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && (document.activeElement === last || !L.contains(document.activeElement))) { e.preventDefault(); first.focus(); }
  }
});
boot();
